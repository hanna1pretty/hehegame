<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#76c8ee" />
  <title>BlockWorld v2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" aria-label="BlockWorld game area">
    <canvas id="gameCanvas"></canvas>

    <div id="centerCrosshair" aria-hidden="true">+</div>

    <section id="startScreen" class="panel">
      <h1>BlockWorld v2</h1>
      <p>Game voxel mini berbasis browser. Bisa dimainkan di HP dan desktop.</p>
      <button id="startButton" type="button">Mulai Game</button>
      <small>HP: geser layar untuk melihat, tombol kiri untuk jalan, kanan untuk aksi.</small>
    </section>

    <section id="pauseMenu" class="panel hidden">
      <h2>Pause</h2>
      <button id="resumeButton" type="button">Lanjut</button>
      <button id="resetButton" type="button">Reset Dunia</button>
    </section>

    <div id="hud" aria-live="polite">
      <span id="blockLabel">Grass</span>
    </div>

    <div id="desktopHelp">
      WASD jalan · Space lompat · Klik kiri hancurkan · Klik kanan pasang · 1-8 pilih block · C tilt · Esc pause
    </div>

    <div id="mobileControls" aria-label="Mobile controls">
      <div id="dpad" class="control-group" aria-label="Movement pad">
        <button class="pad up" data-move="forward" aria-label="Forward">▲</button>
        <button class="pad left" data-move="left" aria-label="Left">◀</button>
        <button class="pad down" data-move="back" aria-label="Back">▼</button>
        <button class="pad right" data-move="right" aria-label="Right">▶</button>
      </div>

      <div id="mobileActions" class="control-group" aria-label="Action buttons">
        <div id="blockBar" aria-label="Block selector"></div>
        <div class="action-row">
          <button class="action" id="jumpButton" type="button">Jump</button>
          <button class="action" id="breakButton" type="button">Break</button>
          <button class="action" id="placeButton" type="button">Place</button>
          <button class="action" id="tiltButton" type="button">Tilt</button>
        </div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
    <pre id="errorBox" class="hidden"></pre>
  </main>

  <script type="module" src="game.js"></script>
</body>
</html>
